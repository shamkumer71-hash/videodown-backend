<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html b:css='false' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
  <title><data:blog.pageTitle/></title>
  <meta content='width=device-width, initial-scale=1' name='viewport'/>
  
  <!-- Font Awesome Icons -->
  <link href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css' rel='stylesheet'/>
  <!-- Google Fonts (Inter) -->
  <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap' rel='stylesheet'/>

  <b:skin><![CDATA[
    /* ========================================================= 
       AIIncomeGuide — style.css Modern AI Directory Website 
       ========================================================= */ 
    :root { 
      --primary: #2563eb; 
      --primary-dark: #1d4ed8; 
      --secondary: #7c3aed; 
      --accent: #06b6d4; 
      --bg-light: #f8fafc; 
      --card-light: rgba(255, 255, 255, 0.88); 
      --text-light: #0f172a; 
      --muted-light: #64748b; 
      --border-light: rgba(148, 163, 184, 0.25); 
      --bg-dark: #020617; 
      --card-dark: rgba(15, 23, 42, 0.78); 
      --text-dark: #f8fafc; 
      --muted-dark: #94a3b8; 
      --border-dark: rgba(148, 163, 184, 0.16); 
      --shadow-sm: 0 4px 16px rgba(15, 23, 42, 0.06); 
      --shadow-md: 0 12px 35px rgba(15, 23, 42, 0.1); 
      --shadow-lg: 0 25px 70px rgba(15, 23, 42, 0.15); 
      --radius-sm: 10px; 
      --radius-md: 16px; 
      --radius-lg: 24px; 
      --transition: 220ms ease; 
    } 

    html { 
      scroll-behavior: smooth; 
      scroll-padding-top: 90px; 
    } 

    body { 
      min-height: 100vh; 
      overflow-x: hidden; 
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
      -webkit-font-smoothing: antialiased; 
      text-rendering: optimizeLegibility; 
      background-color: var(--bg-light);
      color: var(--text-light);
      margin: 0;
      padding: 0;
    } 

    button, input, select, textarea { font: inherit; } 
    button, a { -webkit-tap-highlight-color: transparent; text-decoration: none; } 
    ::selection { background: rgba(37, 99, 235, 0.25); } 

    /* Scrollbar */ 
    ::-webkit-scrollbar { width: 9px; } 
    ::-webkit-scrollbar-track { background: #e2e8f0; } 
    ::-webkit-scrollbar-thumb { 
      background: linear-gradient(180deg, var(--primary), var(--secondary)); 
      border-radius: 999px; 
    } 

    /* Header */ 
    #header { 
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 8%;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(18px); 
      -webkit-backdrop-filter: blur(18px); 
      border-bottom: 1px solid rgba(148, 163, 184, 0.12); 
      transition: background var(--transition), box-shadow var(--transition), border-color var(--transition); 
    } 

    .logo {
      font-weight: 800;
      font-size: 1.4rem;
      color: var(--text-light);
    }

    #desktopNav {
      display: flex;
      gap: 24px;
    }

    #desktopNav a { 
      position: relative; 
      color: var(--muted-light);
      font-weight: 600;
      transition: color var(--transition);
    } 

    #desktopNav a::after { 
      content: ""; 
      position: absolute; 
      left: 0; 
      right: 0; 
      bottom: -8px; 
      height: 2px; 
      width: 0; 
      margin-inline: auto; 
      border-radius: 99px; 
      background: linear-gradient(90deg, var(--primary), var(--secondary)); 
      transition: width var(--transition); 
    } 

    #desktopNav a:hover::after, #desktopNav a.active::after { width: 70%; } 
    #desktopNav a:hover, #desktopNav a.active { color: var(--primary); } 

    /* Hero Section */ 
    .hero-section { 
      isolation: isolate; 
      overflow: hidden; 
      padding: 60px 8%;
      min-height: 550px; 
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      background: radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.1), transparent 30%), 
                  radial-gradient(circle at 90% 10%, rgba(124, 58, 237, 0.12), transparent 30%), 
                  radial-gradient(circle at 80% 90%, rgba(6, 182, 212, 0.08), transparent 28%); 
    } 

    .hero-content {
      max-width: 550px;
    }

    .eyebrow { 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      padding: 7px 12px; 
      border: 1px solid rgba(37, 99, 235, 0.18); 
      border-radius: 999px; 
      background: rgba(37, 99, 235, 0.07); 
      color: var(--primary); 
      font-size: 0.78rem; 
      font-weight: 700; 
      letter-spacing: 0.06em; 
      text-transform: uppercase; 
    } 

    .hero-title { 
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.04em; 
      line-height: 1.15; 
      margin: 18px 0;
    } 

    .gradient-text { 
      background: linear-gradient(100deg, #2563eb 0%, #7c3aed 45%, #06b6d4 100%); 
      -webkit-background-clip: text; 
      background-clip: text; 
      color: transparent; 
    } 

    .hero-copy {
      color: var(--muted-light);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    /* Hero Graphic */ 
    .hero-visual { 
      position: relative; 
      width: 400px;
      height: 400px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    } 

    .hero-orb { 
      position: absolute; 
      width: 280px; 
      height: 280px; 
      border-radius: 50%; 
      background: radial-gradient(circle at 35% 30%, rgba(96, 165, 250, 0.5), transparent 25%), 
                  radial-gradient(circle at 70% 70%, rgba(168, 85, 247, 0.55), transparent 35%), 
                  linear-gradient(135deg, rgba(37, 99, 235, 0.8), rgba(124, 58, 237, 0.8)); 
      filter: blur(1px); 
      opacity: 0.9; 
      box-shadow: 0 0 80px rgba(37, 99, 235, 0.25), 0 0 130px rgba(124, 58, 237, 0.18); 
      animation: orbPulse 5s ease-in-out infinite; 
    } 

    .ai-core { 
      position: relative; 
      z-index: 3; 
      width: 130px; 
      height: 130px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      border: 1px solid rgba(255, 255, 255, 0.3); 
      border-radius: 32px; 
      background: rgba(15, 23, 42, 0.55); 
      backdrop-filter: blur(18px); 
      -webkit-backdrop-filter: blur(18px); 
      box-shadow: 0 20px 70px rgba(15, 23, 42, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.18); 
      color: white; 
      font-size: 3rem; 
      animation: coreFloat 4s ease-in-out infinite; 
    } 

    .floating-card { 
      position: absolute; 
      z-index: 5; 
      min-width: 130px; 
      padding: 12px 14px; 
      border: 1px solid rgba(148, 163, 184, 0.22); 
      border-radius: 16px; 
      background: rgba(255, 255, 255, 0.85); 
      backdrop-filter: blur(15px); 
      -webkit-backdrop-filter: blur(15px); 
      box-shadow: 0 15px 40px rgba(15, 23, 42, 0.12); 
      font-size: 0.85rem;
      font-weight: 600;
      animation: floatingCard 5s ease-in-out infinite; 
    } 

    .card-tools { top: 10%; left: 0%; animation-delay: 0s; } 
    .card-income { top: 20%; right: 0%; animation-delay: 1s; } 
    .card-prompts { bottom: 15%; left: 0%; animation-delay: 2s; } 
    .card-roadmap { bottom: 5%; right: 0%; animation-delay: 3s; } 

    /* Keyframes */ 
    @keyframes orbPulse { 0%, 100% { transform: scale(0.96); opacity: 0.82; } 50% { transform: scale(1.05); opacity: 1; } } 
    @keyframes coreFloat { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-12px) rotate(2deg); } } 
    @keyframes floatingCard { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } } 

    /* Main Container / Blog Area */
    .main-container {
      padding: 50px 8%;
    }

    .post {
      background: var(--card-light);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }

    .post-title a {
      color: var(--text-light);
      font-size: 1.5rem;
      font-weight: 700;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .hero-section { flex-direction: column; text-align: center; }
      .hero-visual { width: 100%; height: 320px; }
      #desktopNav { display: none; }
    }
  ]]></b:skin>
</head>
<body>

  <!-- Header Section -->
  <header id='header'>
    <a class='logo' href='/'><span class='gradient-text'>AI Income</span> Guide</a>
    <nav id='desktopNav'>
      <a class='active' href='/'>Home</a>
      <a href='#directory'>Tools</a>
      <a href='#prompts'>Prompts</a>
      <a href='#roadmaps'>Roadmaps</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class='hero-section'>
    <div class='hero-content'>
      <span class='eyebrow'><i class='fa-solid fa-bolt'/> Next-Gen AI Directory</span>
      <h1 class='hero-title'>Unlock Your Potential with <span class='gradient-text'>AI Tools</span></h1>
      <p class='hero-copy'>Discover top-rated AI tools, prompt templates, and actionable income roadmaps to supercharge your workflow.</p>
    </div>

    <div class='hero-visual'>
      <div class='hero-orb'/>
      <div class='ai-core'>
        <i class='fa-solid fa-brain'/>
      </div>

      <!-- Floating Cards -->
      <div class='floating-card card-tools'><i class='fa-solid fa-wand-magic-sparkles'/> 500+ Tools</div>
      <div class='floating-card card-income'><i class='fa-solid fa-chart-line'/> Income Guides</div>
      <div class='floating-card card-prompts'><i class='fa-solid fa-terminal'/> AI Prompts</div>
      <div class='floating-card card-roadmap'><i class='fa-solid fa-route'/> Roadmaps</div>
    </div>
  </section>

  <!-- Blogger Blog Posts Section -->
  <main class='main-container'>
    <b:section id='main' class='main'>
      <b:widget id='Blog1' locked='true' type='Blog' version='1'/>
    </b:section>
  </main>

</body>
</html>
